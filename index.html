  if(!("Notification" in window)||Notification.permission!=="granted")return;

  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(function(reg){if(reg&&reg.showNotification)reg.showNotification(t("brand"),o);else fb()}).catch(fb);

function tick(){
 var d=new Date(),today=dayKey(d),mins=d.getHours()*60+d.getMinutes(),ch=false;
 state.routes.forEach(function(r){
  var dk=r.id+"|"+today;
  if(!rideActive(r)||!nowLocked(r)||dueSeen[dk])return;
  var acc=state.requests.filter(function(q){return q.rid===r.id&&q.status==="accepted"});
  if(!acc.length)return;
  dueSeen[dk]=1;ch=true;
  var p=String(r.time).split(":");if(mins-((+p[0])*60+(+p[1]))>180)return;
  if(r.mine)DB.notifySelf("d","due_d",{rid:r.id});
  acc.forEach(function(q){if(cloud?q.mine:(q.mine||r.mine))DB.notifySelf("p","due_p",{rid:r.id,qid:q.id})});
 });
 if(ch){try{localStorage.setItem("carpool-due",JSON.stringify(dueSeen))}catch(e){}}
 if(purgeExpired())doRender();
 if(typeof pendingRender!=="undefined"&&pendingRender&&!guardBusy()){pendingRender=false;softRender()}
 refreshGates();
 var nx=Infinity;state.routes.forEach(function(r){if(!rideActive(r))return;var p=String(r.time).split(":"),t0=new Date();t0.setHours(+p[0],+p[1],0,0);var d=t0-Date.now();if(d>0&&d<nx)nx=d});clearTimeout(window.dueT);if(nx<3600000)window.dueT=setTimeout(tick,nx+150);
}

ega?","li":["Share fuel and travel costs with passengers","Fewer cars on the road means less traffic","Publish a ride or send a request in a few taps","See the route on the map and follow the car live once the trip starts"],"ip":"For better use and to make sure notifications reach you, install the HawRega app.","ib":"Install the HawRega app","ih":"Android: in Chrome tap ⋮ → Install app.\niPhone: in Safari tap Share → Add to Home Screen.","id":"The app is already installed","h3":"HawRega safety and how to protect yourself","sl":["Check the name, number and car before riding.","Meet in a public, well-lit place, and do not go if you feel uncomfortable.","Share the trip details with someone you trust.","Never share bank card numbers or passwords with anyone."],"warn":"HawRega only connects people; agreements and payment are between you, and anything that happens has nothing to do with the owner of this website.","h4":"Creator of HawRega","h5":"Creator’s social networks"},"ar":{"title":"حول هاوريكه","h1":"ما هو هاوريكه؟","p1":"هاوريكه موقع لمشاركة الرحلات (Carpooling) في كردستان، يربط السائقين والركاب الذين يسلكون الطريق نفسه لتقاسم تكاليف التنقل وتخفيف الازدحام.","h2":"لماذا هاوريكه؟","li":["تقاسم تكلفة الوقود والتنقل مع الركاب","سيارات أقل على الطريق وازدحام أقل","انشر رحلة أو أرسل طلبًا ببضع نقرات","شاهد الطريق على الخريطة وتابع السيارة مباشرةً بعد بدء الرحلة"],"ip":"لاستخدام أفضل ولضمان وصول الإشعارات إليك، ثبّت تطبيق هاوريكه.","ib":"تثبيت تطبيق هاوريكه","ih":"أندرويد: في Chrome اضغط ⋮ ← Install app.\nآيفون: في Safari اضغط Share ← Add to Home Screen.","id":"التطبيق مثبّت بالفعل","h3":"أمان هاوريكه وكيف تحمي نفسك","sl":["تحقق من الاسم والرقم والسيارة قبل الركوب.","التقِ في مكان عام ومضاء، ولا تذهب إذا شعرت بعدم الارتياح.","شارك تفاصيل الرحلة مع شخص تثق به.","لا تشارك أرقام البطاقات المصرفية أو كلمات المرور مع أحد."],"warn":"هاوريكه يربط الأشخاص فقط؛ الاتفاق والدفع بينكم، وأي شيء يحدث لا علاقة له بمالك هذا الموقع.","h4":"مُنشئ هاوريكه","h5":"حسابات المُنشئ على مواقع ال  function end(e,cancel){if(!D||e.pointerId!==D.id)return;var was=mv,b=under(e.clientX+D.off);D=null;mv=false;nav.classList.remove("drag");pl.style.transition="";

  if(!was){var sb=nav.querySelector('button[aria-selected="true"]');if(!cancel&&sb&&sb.dataset.tab!==state.tab)sb.click();return}

  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;
  D={id:e.pointerId,x0:e.clientX,off:r.left+r.width/2-e.clientX,w:r.width};mv=false;try{nav.setPointerCapture(e.pointerId)}catch(x){}});

  if(!mv){if(Math.abs(e.clientX-D.x0)<5)return;mv=true;nav.classList.add("drag");pl.style.transition="none"}
  var nr=nav.getBoundingClientRect(),c=e.clientX+D.off,x=c-(nr.left+nav.clientLeft)-D.w/2;x=Math.max(4,Math.min(x,nav.clientWidth-D.w-4));
  pl.style.transform="translateX("+x+"px) scale(1.07)";paint(under(c));e.preventDefault()});
 nav.addEventListener("pointerup",function(e){end(e,false)});
