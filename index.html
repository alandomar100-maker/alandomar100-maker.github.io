function tick(){
 var d=new Date(),today=dayKey(d),mins=d.getHours()*60+d.getMinutes(),ch=false;
 state.routes.forEach(function(r){
  var dk=r.id+"|"+today;
  if(!rideActive(r)||!nowLocked(r)||dueSeen[dk])return;
  var acc=state.requests.filter(function(q){return q.rid===r.id&&q.status==="accepted"});
  if(!acc.length)return;
  dueSeen[dk]=1;ch=true;
  var p=String(r.time).split(":");if(mins-((+p[0])*60+(+p[1]))>180)return;
  if(r.mine)DB.notifySelf("d","due_d",{rid:r.id});
  acc.forEach(function(q){if(cloud?q.mine:(q.mine||r.mine))DB.notifySelf("p","due_p",{rid:r.id,qid:q.id})});
 });
 if(ch){try{localStorage.setItem("carpool-due",JSON.stringify(dueSeen))}catch(e){}}
 if(purgeExpired())doRender();
 if(typeof pendingRender!=="undefined"&&pendingRender&&!guardBusy()){pendingRender=false;softRender()}
 refreshGates();
 var nx=Infinity;state.routes.forEach(function(r){if(!rideActive(r))return;var p=String(r.time).split(":"),t0=new Date();t0.setHours(+p[0],+p[1],0,0);var d=t0-Date.now();if(d>0&&d<nx)nx=d});clearTimeout(window.dueT);if(nx<3600000)window.dueT=setTimeout(tick,nx+150);
}

 if(c==="auth/email-already-in-use")return t("au_e_exists");
 if(c==="auth/weak-password")return t("au_e_weak");
 if(c==="auth/network-request-failed")return t("au_e_net");
 if(/user-not-found|wrong-password|invalid-credential|invalid-login/.test(c))return t("au_e_cred");
 if(c==="auth/operation-not-allowed")return t("au_e_off");
 if(c==="auth/unauthorized-domain")return t("au_e_dom");
 if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")return "";
 return t("au_e_other")+" ("+c+")";
}
function paintAuth(){

 (su?'<input id="au_n" placeholder="'+esc(t("name"))+'" autocomplete="name">':'')+
 '<input id="au_e" type="email" inputmode="email" autocomplete="email" placeholder="'+esc(t("au_email"))+'"><input id="au_p" type="password" autocomplete="'+(su?'new-password':'current-password')+'" placeholder="'+esc(t("au_pass"))+'">'+
 '<div class="auerr" id="auerr"></div><button type="button" class="btn" id="augo" style="width:100%">'+(su?t("au_signup"):t("au_login"))+'</button>'+
 '<button type="button" class="btn sec" id="augg" style="width:100%;margin-top:8px">'+t("au_google")+'</button>'+
 (su?'':'<button type="button" class="aulink" id="aufg">'+t("au_forgot")+'</button>')+'</div>';
}
function openAuth(){if(document.getElementById("aubg"))return;var bg=document.createElement("div");bg.className="aubg";bg.id="aubg";document.body.appendChild(bg);paintAuth()}
function auSubmit(){
 if(auBusy)return;
 var em=(document.getElementById("au_e").value||"").trim(),pw=document.getElementById("au_p").value||"",nm=((document.getElementById("au_n")||{}).value||"").trim();
 if(auMode==="signup"&&!nm){auErr(t("au_e_name"));return}
 auBusy=true;auErr(t("au_wait"));
 var isSu=auMode==="signup";ngSet(true);
 var p=isSu?FB.auth.createUserWithEmailAndPassword(em,pw).then(function(c){state.me=nm;ngSet(true);return c.user.updateProfile({displayName:nm})}):FB.auth.signInWithEmailAndPassword(em,pw);
 p.then(function(){auBusy=false;openNotifGate()},function(e){auBusy=false;ngSet(false);auErr(auMsg(e))});
}
function auGoogle(){if(auBusy)return;ngSet(true);FB.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(function(){openNotifGate()}).catch(function(e){ngSet(false);auErr(auMsg(e))})}
function auForgot(){
 var em=((document.getElementById("au_e")||{}).value||"").trim();if(!em){auErr(t("au_need_email"));return}
 FB.auth.sendPasswordResetEmail(em).then(function(){auErr(t("au_reset_sent"))},function(e){auErr(auMsg(e))});
}

/* ---- notification gate shown right after creating an account ---- */
var NGKEY="carpool-notifgate";
function ngPending(){try{return localStorage.getItem(NGKEY)==="1"}catch(e){return false}}
function ngSet(v){try{if(v)localStorage.setItem(NGKEY,"1");else localStorage.removeItem(NGKEY)}catch(e){}}
function ngClose(){var b=document.getElementById("ngbg");if(b)b.remove()}
function ngDone(){ngSet(false);ngClose()}
function ngPaint(){
 var bg=document.getElementById("ngbg");if(!bg)return;
 var sup=("Notification" in window),perm=sup?Notification.permission:"unsupported";
 var inapp=/TikTok|Instagram|FBAN|FBAV|Snapchat|Line\//i.test(navigator.userAgent||"");
 var h='<div class="tmbox"><button type="button" class="tmx" id="ngx" aria-label="close">\u00d7</button><div class="tmico">🔔</div><h2>'+t("notif_title")+'</h2>'+((!sup&&isIOS())?'':'<p class="ngtxt">'+t("ng_txt")+'</p>');
 if(!sup)h+=unsupHtml();
 else{
  h+='<button type="button" class="btn" id="ngperm" style="width:100%;margin-bottom:8px">🔔 '+t("notif_perm")+'</button>';
  if(ntMsg||inapp)h+='<p class="maphint">⚠️ '+t("notif_nodlg")+'</p>';
 }
 bg.innerHTML=h+'</div>';
}
function openNotifGate(){
 if(document.getElementById("ngbg"))return;
 if(("Notification" in window)&&Notification.permission==="granted"){ngSet(false);return}
 var bg=document.createElement("div");bg.className="tmbg";bg.id="ngbg";document.body.appendChild(bg);ngPaint();
}
function ngAfter(p){
 if(!document.getElementById("ngbg"))return;
 ntMsg=p||"x";
 if(p==="granted"){try{sysNotify(t("notif_test"),"nt-test")}catch(e){}registerPush().then(function(st){pushState=st});ngDone();return}
 ngPaint();
}
function ngPerm(){
 try{var rr=Notification.requestPermission(function(p){ngAfter(p)});if(rr&&rr.then)rr.then(ngAfter,function(){ngAfter("denied")})}catch(e){ngAfter("unsupported")}
}
document.addEventListener("visibilitychange",function(){
 if(document.hidden||!document.getElementById("ngbg"))return;
 if(("Notification" in window)&&Notification.permission==="granted"){registerPush().then(function(st){pushState=st});ngDone()}else ngPaint();
});

ckb:[
["هاوڕێگە چییە؟","هاوڕێگە وێبسایتێکە شۆفێر و سەرنشین بەیەکەوە دەبەستێتەوە کە بە هەمان ڕێگادا دەڕۆن، بۆ ئەوەی تێچووی بەنزین دابەش بکەن و قەرەباڵغی جادەکان کەم ببێتەوە.\nئێمە تەنها پەیوەندیتان پێکەوە دەبەستین؛ ڕێککەوتن و پارەدان لە نێوان خۆتاندایە."],
["١. دروستکردنی هەژمار","لە شاشەی یەکەم زمان هەڵبژێرە و مەرج و یاساکان قبوڵ بکە.\nدواتر بە ئیمەیڵ یان Google هەژمار دروست بکە یان بچۆ ژوورەوە.\nلە تابی «ڕێگاکان» ناو و ژمارەی تەلەفۆن - WhatsApp و ناونیشانت بنووسە، چونکە شۆفێر پێویستی پێیانە. (ژمارەکەت تەنها دوای وەرگرتنی داواکەت بۆ شۆفێر دەردەکەوێت.)"],
["٢. وەک سەرنشین: دۆزینەوەی ڕێگا","لە تابی «ڕێگاکان» بە ناوی شوێن بگەڕێ یان بە جۆری شوێن فلتەر بکە (زانکۆ، کار، نەخۆشخانە، فڕۆکەخانە...).\nلە تابی «نەخشە» هەموو ڕێگا بەردەستەکان لەسەر نەخشە دەبینیت.\nکارتی هەر ڕێگایەک کات، ڕۆژەکان، ماوەی ڕۆیشتن، شوێنی بەتاڵ و کرێی هەر سەرنشینێک نیشان دەدات."],
["٣. ناردنی داوا","«🙋 داوا بنێرە» دابگرە و دڵنیابوونەوە بکە. شۆفێر ئاگادار دەکرێتەوە.\nکاتێک شۆفێر وەریگرت یان ڕەتیکردەوە ئاگادار دەکرێیتەوە. دوای وەرگرتن دوگمەی WhatsApp دەردەکەوێت بۆ پەیوەندی.\nئەگەر هەموو شوێنەکان پڕ بوون یان ڕێگاکە کۆتایی هاتبێت، ناتوانرێت داوا بنێردرێت."],
["٤. وەک شۆفێر: بڵاوکردنەوەی ڕێگا","لە تابی «ڕێگا زیادبکە» ئەمانە پڕ بکەرەوە: شوێنی دەستپێک و مەبەست (بە نووسین یان بە دەستلێدان لەسەر نەخشە)، کاتی ڕۆیشتن، ژمارەی شوێنی بەتاڵ، کرێی هەر سەرنشینێک، جۆری شوێن، ڕۆژەکانی ڕۆیشتن و **ماوەی ڕۆیشتن (پێویستە)**.\nئەگەر هەردوو شوێن لەسەر نەخشە دیاری بکەیت، دووری و ماوەی گەیشتن خۆکارانە دەنووسرێن.\nدواتر «🚀 ڕێگاکە بڵاو بکەرەوە» دابگرە."],
["٥. ماوەی بەردەستبوونی ڕێگا","ڕێگا تا کۆتا ڕۆژی هەڵبژێردراو + کاتی دەرچوون + ماوەی ڕۆیشتن بەردەستە.\nبۆ نموونە: یەکشەممە تا چوارشەممە، کاتژمێر ٧:٣٠، ماوەی ٣٠ خولەک ← بەردەستە تا چوارشەممە ٨:٠٠.\nدوای ئەوە ڕێگاکە وەک «کۆتایی هاتووە» دەمێنێتەوە بۆ خۆت و دەتوانیت بە 🗑️ بیسڕیتەوە."],
["٦. کرێی هەر سەرنشینێک","شۆفێر خۆی کرێی هەر سەرنشینێک دیاری دەکات (بۆ نموونە ٢٠٠٠ دینار) کاتێک ڕێگا بڵاو دەکاتەوە.\nسەرنشین ئەو بڕە دەدات بە شۆفێر. کرێیەکە لەسەر کارتی ڕێگاکە دەردەکەوێت و ڕێککەوتنی پارەدان لە نێوان خۆتاندایە."],
["٧. وەرگرتن و ڕەتکردنەوەی داواکان","لە تابی «داواکان» داواکانی سەرنشینەکان دەبینیت و «✅ وەرگرتن» یان «❌ ڕەتکردنەوە» دەکەیت.\nدوای وەرگرتن، ژمارەی تەلەفۆن - WhatsApp و ناونیشانی سەرنشین دەبینیت."],
["٨. کاتی ڕۆیشتن","کاتێک کاتی دەرچوون دێت، دوو دوگمە چالاک دەبن (پێشتر داخراون):\n🚗 «دەستپێکردنی ڕۆیشتن»: شۆفێر دایدەگرێت و هەموو سەرنشینەکان ئاگادار دەکرێنەوە.\n🙋 «ئامادەم»: سەرنشین دایدەگرێت و شۆفێر ناو و ناونیشانی دەبینێت.\nئەم دوگمانە تەنها لە ماوەی ڕۆیشتندا چالاکن."],
["٩. هەڵوەشاندنەوە و سڕینەوە","دەتوانیت داوا یان ڕێگا هەڵبووەشێنیتەوە **پێش کاتی دەرچوون** یان **دوای تەواوبوونی ماوەی ڕۆیشتنی ئەو ڕۆژە** (بۆ ڕۆژەکانی ماوە). لە ماوەی ڕۆیشتندا ناتوانرێت. لایەنی تر ئاگادار دەکرێتەوە.\nڕێگا و داوا کۆتاییهاتووەکان یان هەڵوەشێنراوەکان بە دوگمەی 🗑️ دەسڕدرێنەوە."],
["١٠. ئاگادارکردنەوە","لە سەرەوە 🔔 دابگرە و «ئاگادارکردنەوەی مۆبایل چالاک بکە»، و لە Chrome ڕێگە بدە.\nبۆ ئەوەی ئاگادارکردنەوە کاتێک ئەپەکە داخراویشە بێت، پێویستە سێرڤەرەکە ڕێکخرابێت. بۆ تاقیکردنەوە «🧪» بەکاربهێنە.\nبۆ ئەوەی وەک ئەپ بێت: Chrome ← ⋮ ← Install app."],
["١١. ئاسایش","پێش سواربوون ناو و ژمارە و ئۆتۆمبێل بپشکنە، لە شوێنێکی گشتی یەکتر ببینن، و ئەگەر هەستت بە ناڕەحەتی کرد مەڕۆ.\nئەم وێبسایتە تەنها بەستنەوەیە؛ هەر ڕووداو یان ئاڵۆزییەک لە نێوان خۆتاندا چارەسەر دەکرێت و خاوەنی وێبسایتەکە بەرپرسیار نییە."]
],
en:[
["What is HawRega?","HawRega connects drivers and passengers who travel the same road so they can share fuel costs and reduce traffic.\nWe only connect you; agreements and payment are between you."],
["1. Create an account","Choose your language on the first screen and accept the terms.\nThen sign up with email or Google, or sign in.\nIn the “Rides” tab enter your name, WhatsApp number and address, because the driver needs them. (Your number is shown to the driver only after they accept your request.)"],
["2. As a passenger: find a ride","In the “Rides” tab search by place name or filter by place type (university, work, hospital, airport…).\nThe “Map” tab shows all available rides on a map.\nEach card shows the time, days, trip duration, free seats and the price per person."],
["3. Send a request","Tap “🙋 Request a seat” and confirm. The driver is notified.\nYou are notified when the driver accepts or declines. After acceptance a WhatsApp button appears.\nYou cannot request when all seats are taken or the ride has ended."],
["4. As a driver: publish a ride","In the “Offer a ride” tab fill in: start and destination (typed or picked on the map), departure time, free seats, the fare per passenger, place type, travel days and the **trip duration (required)**.\nIf you pick both places on the map, the distance and duration are filled in automatically.\nThen tap “🚀 Publish ride”."],
["5. How long a ride stays available","A ride stays available until the last selected day + departure time + trip duration.\nExample: Sunday to Wednesday, 7:30, 30 minutes → available until Wednesday 8:00.\nAfterwards it stays as “ended” for you and you can remove it with 🗑️."],
["6. Fare per passenger","The driver sets the fare per passenger (for example 2000 IQD) when publishing the ride.\nThe passenger pays that amount to the driver. The price is shown on the ride card and payment is arranged between you."],
["7. Accept or decline requests","In the “Requests” tab you see passenger requests and tap “✅ Accept” or “❌ Decline”.\nAfter accepting you can see the passenger’s WhatsApp number and address."],
["8. Departure time","When the departure time comes, two buttons become active (they are locked before):\n🚗 “Start the trip”: the driver taps it and all passengers are notified.\n🙋 “I’m ready”: the passenger taps it and the driver sees their name and address.\nThese buttons are only active during the trip time."],
["9. Cancelling and deleting","You can cancel a request or ride **before the departure time** or **after that day’s trip time is over** (for the remaining days). Not during the trip. The other side is notified.\nEnded or cancelled rides and requests can be removed with 🗑️."],
["10. Notifications","Tap 🔔 at the top and “Enable phone notifications”, then allow it in Chrome.\nFor notifications while the app is closed the server must be set up. Use “🧪” to test.\nTo use it like an app: Chrome → ⋮ → Install app."],
["11. Safety","Check the name, number and car before riding, meet in a public place, and do not go if you feel uncomfortable.\nThis site only connects people; any incident is resolved between you and the site owner is not responsible."]
],
ar:[
["ما هو هاوريكه؟","هاوريكه يربط بين السائقين والركاب الذين يسلكون نفس الطريق ليتقاسموا تكلفة الوقود ويقل الازدحام.\nنحن نربط بينكم فقط؛ الاتفاق والدفع بينكم."],
["1. إنشاء حساب","اختر لغتك في الشاشة الأولى ووافق على الشروط.\nثم سجل بالبريد أو Google أو سجل الدخول.\nفي تبويب «الرحلات» اكتب اسمك ورقم واتساب وعنوانك لأن السائق يحتاجها. (رقمك يظهر للسائق فقط بعد قبول طلبك.)"],
["2. كراكب: ابحث عن رحلة","في تبويب «الرحلات» ابحث باسم المكان أو صفِّ حسب نوع المكان (جامعة، عمل، مستشفى، مطار…).\nتبويب «الخريطة» يعرض كل الرحلات المتاحة على الخريطة.\nتعرض كل بطاقة الوقت والأيام ومدة الرحلة والمقاعد الشاغرة والسعر للشخص."],
["3. إرسال طلب","اضغط «🙋 أرسل طلبا» وأكد. يصل إشعار للسائق.\nستصلك إشعارات عند القبول أو الرفض. بعد القبول يظهر زر واتساب.\nلا يمكن الطلب إذا امتلأت المقاعد أو انتهت الرحلة."],
["4. كسائق: انشر رحلة","في تبويب «أضف رحلة» املأ: نقطة البداية والوجهة (كتابة أو تحديد على الخريطة) ووقت المغادرة والمقاعد الشاغرة وأجرة كل راكب ونوع المكان وأيام الذهاب و**مدة الرحلة (مطلوبة)**.\nإذا حددت المكانين على الخريطة تُملأ المسافة والمدة تلقائيا.\nثم اضغط «🚀 انشر الرحلة»."],
["5. مدة بقاء الرحلة متاحة","تبقى الرحلة متاحة حتى آخر يوم مختار + وقت المغادرة + مدة الرحلة.\nمثال: من الأحد إلى الأربعاء، 7:30، 30 دقيقة ← متاحة حتى الأربعاء 8:00.\nبعدها تبقى لك كـ«منتهية» ويمكنك حذفها بـ 🗑️."],
["6. أجرة كل راكب","يحدد السائق أجرة كل راكب (مثلا 2000 دينار) عند نشر الرحلة.\nيدفع الراكب هذا المبلغ للسائق. يظهر السعر على بطاقة الرحلة والدفع يتم الاتفاق عليه بينكم."],
["7. قبول أو رفض الطلبات","في تبويب «الطلبات» ترى طلبات الركاب وتضغط «✅ قبول» أو «❌ رفض».\nبعد القبول ترى رقم واتساب الراكب وعنوانه."],
["8. وقت المغادرة","عند حلول وقت المغادرة يفعَّل زران (مقفلان قبله):\n🚗 «بدء الرحلة»: يضغطه السائق فيصل إشعار لكل الركاب.\n🙋 «أنا جاهز»: يضغطه الراكب فيرى السائق اسمه وعنوانه.\nهذان الزران يعملان فقط في وقت الرحلة."],
["9. الإلغاء والحذف","يمكنك إلغاء طلب أو رحلة **قبل وقت المغادرة** أو **بعد انتهاء وقت رحلة ذلك اليوم** (للأيام المتبقية). لا يمكن أثناء الرحلة. يصل إشعار للطرف الآخر.\nالرحلات والطلبات المنتهية أو الملغاة يمكن حذفها بـ 🗑️."],
["10. الإشعارات","اضغط 🔔 في الأعلى ثم «تفعيل إشعارات الهاتف» واسمح بها في Chrome.\nلتصلك الإشعارات والتطبيق مغلق يجب إعداد الخادم. استخدم «🧪» للتجربة.\nلاستخدامه كتطبيق: Chrome ← ⋮ ← Install app."],
["11. السلامة","تحقق من الاسم والرقم والسيارة قبل الركوب، والتقوا في مكان عام، ولا تذهب إن شعرت بعدم الارتياح.\nهذا الموقع للربط فقط؛ أي حادث يُحل بينكم ولا يتحمل مالك الموقع المسؤولية."]
]};
GUIDE.bdl=[["Hawrêga çi ye?","Hawrêge malper şofêr û sernişînan bi hev ve girê didet ewên bi heman rê diçini, da xerciya benzînê parve biken û qerebalxiya cadeyan kêm bibît.\nEm tenê peywendiyê d navbera heweda çê dikeyni؛ rêkkeftin û paredan d navbera hewedaye."],["١. dirûstikrina hejmarê","Li şaşeya yekê ziman helbijêre û merc û rêsayan qibûl bike.\nPaşy bi e-name an Google hejmarekê dirûst bike an biçe jûr.\nLi taba «rê» nav û jimara telefonê - WhatsApp û navnîşanê xo binivîse, çûnkiy şofêr pêdviy pê jiy heye. (jimara te tenê pişitiy wergirtina daxwaza te bo şofêrî diyar dibît.)"],["٢. wek sernişîn: dîtna rêyê","Li taba «rê» bi navê cihiy bigere an bi corê cihiy filiter bike (zanko, kar, nexoşxane, firokexane...).\nLi taba «nexşe» hemî rêyên berdest li ser nexşê dibîny.\nKarta her rêyekê dem, rojan, maweyê çûnê, cihên betal û kirêya her sernişîneky nîşan didet."],["٣. rêyê li ser nexşê bibîne","Li taba «rê» destê xo bide beşê cihê derçûnê û mebestê (ew beşê 📍 û 🏁 têda).\nEger şofêrî rê li ser nexşê diyar kiribît, nexşeyek dihête vekrin û rêyê nîşan didet, û bi dûgmeya × li layê rastê sery dadxey.\nEger diyar nekribît, peyama «bibûre, şofêrî rê li ser nexşê diyar nekrîye» diyar dibît."],["٤. nardina daxwazê","«🙋 daxwaz bişêne» bigire û diliniyabûnê bike. şofêr agahdar dibît.\nDemê şofêrî wergirt an retkir, ez agahdar dibiy. pişitiy wergirtinê dûgmeya WhatsApp diyar dibît bo peywendiyê.\nEger hemî cih pir bin an rê bi dûmahy hatbît, neşêy daxwazê bişêny."],["٥. wek şofêr: belavkirna rêyê","Li taba «rê zêdebke» van tişitan pir bike: cihê destipêkê û mebestê (bi nivîsîn an bi destidanê li ser nexşê), demê çûnê, jimara cihên betal, kirêya her sernişînekî, corê cihî, rojên çûnê û maweyê çûnê (pêdvîye).\nEger herdû cihan li ser nexşê diyar bikey, dûry û maweyê gehşitnê bi xokar dihêne nivîsîn.\nPaşy «🚀 rêyê belav bike» bigire."],["٦. cihê derçûnê û mebestê helbijêre","Li taba «rê zêdebke» bo her yek ji «ji kîrê» û «bo kîrê»:\n١) parêzgehê helbijêre\n٢) bajar an qezayê helbijêre (ev herdû pêdvîne)\n٣) nahyeyê helbijêre (arezûmendane)\n٤) cihê diyarkiry binivîse (gerek, şeqam, nêzîk...) an li ser nexşê diyar bike.\nLi her lîstekê xaneya geranê 🔎 heye.\n📍 navnîşanê xo jiy (li taba «rê») bi heman şêwe helbijêre û binivîse."],["٧. maweyê berdestibûna rêyê","Rê heta roja dûmahyê ya helbijartiy + demê derçûnê + maweyê çûnê berdeste.\nBo nimûne: êkşembiy heta çarşembî, demjimêr ٧:٣i٠ AM, mawe ٣i٠ xûlek ← berdeste heta çarşembiy ٨:٠i٠ AM.\nPişitiy wê rê wek «bi dûmahy hat» dimînît bo te û dişêy bi 🗑️ jêbey."],["٨. kirêya her sernişîneky","Şofêr xo kirêya her sernişîneky diyar diket (bo nimûne ٢i٠i٠i٠ dînar) demê rêyê belav diket.\nSernişîn viy biriy didete şofêrî. kirê li ser karta rêyê diyar dibît û rêkkeftina paredanê d navbera hewedaye."],["٩. wergirtin û retkirna daxwazan","Li taba «daxwaz» daxwazên sernişînan dibîny û «✅ wergirtin» an «❌ retkirn» dikey.\nPişitiy wergirtinê, jimara telefonê - WhatsApp û navnîşanê sernişîny dibîny."],["١i٠. demê çûnê","Demê demê derçûnê dihêt, dû dûgme çalak dibin (bery wê daxsitîne):\n🚗 «destipêkrina çûnê»: şofêr digirît û hemî sernişîn agahdar dibin.\n🙋 «amademe»: sernişîn digirît û şofêr nav û navnîşanê wiy dibînît.\nEger bery demy bigirî, peyamek diyar dibît ku berdest nîne heta demê çûnê dihêt.\nVan dûgmeyan tenê d maweyê çûnêda kar diken."],["١i١. helweşandin û jêbrin","Dişêy daxwaz an rêyê helbiweşêny **bery demê derçûnê** an **pişitiy temambûna maweyê çûnê ya wê rojê** (bo rojên mayy). d maweyê çûnêda neşêy. layê diy agahdar dibît.\nRê û daxwazên bi dûmahy haty an helweşandiy bi dûgmeya 🗑️ dihêne jêbrin."],["١i٢. agahdarkirin","Li sery 🔔 bigire û «agehdarkirna mobîlê çalak bike», û li Chrome rê bide.\nBo ewê agahdarkirin demê ep vemriyayy jiy bihên, pêdvîye sêrver rêkxirabît.\nBo ewê wek ep bît: Chrome ← ⋮ ← Install app."],["١i٣. asayş","Bery siwarbûnê nav û jimare û otombêlê bipişikine, li cihekê gişitiy êkdiw bibînni, û eger hestê bi nerehetyê kir neçe.\nEv malper tenê girêdane؛ her rûdan an alozîyek d navbera xoda çareser diken û xûdanê malperê berpirsiyar nîne."]];
GUIDE.bdn=[["هاوڕێگە چییە؟","هاوڕێگە ماڵپەڕەکە شوفێر و سەرنشینان ب هەڤ ڤە گرێ ددەت ئەوێن ب هەمان ڕێ دچن، دا خەرجیا بەنزینێ پارڤە بکەن و قەرەبالغیا جادەیان کێم ببیت.\nئەم تنێ پەیوەندیێ د ناڤبەرا هەوەدا چێ دکەین؛ ڕێککەفتن و پارەدان د ناڤبەرا هەوەدایە."],["١. دروستکرنا هەژمارێ","ل شاشەیا ئێکێ زمان هەلبژێرە و مەرج و ڕێسایان قبوول بکە.\nپاشی ب ئیمەیل یان Google هەژمارەکێ دروست بکە یان بچە ژوور.\nل تابا «ڕێ» ناڤ و ژمارا تەلەفۆنێ - WhatsApp و ناڤنیشانێ خۆ بنڤیسە، چونکی شوفێر پێدڤی پێ ژی هەیە. (ژمارا تە تنێ پشتی وەرگرتنا داخوازا تە بۆ شوفێری دیار دبیت.)"],["٢. وەک سەرنشین: دیتنا ڕێیێ","ل تابا «ڕێ» ب ناڤێ جهی بگەڕە یان ب جۆرێ جهی فلتەر بکە (زانکۆ، کار، نەخۆشخانە، فرۆکەخانە...).\nل تابا «نەخشە» هەمی ڕێیێن بەردەست ل سەر نەخشێ دبینی.\nکارتا هەر ڕێیەکێ دەم، ڕۆژان، ماوەیێ چوونێ، جهێن بەتاڵ و کرێیا هەر سەرنشینەکی نیشان ددەت."],["٣. ڕێیێ ل سەر نەخشێ ببینە","ل تابا «ڕێ» دەستێ خۆ بدە بەشێ جهێ دەرچوونێ و مەبەستێ (ئەو بەشێ 📍 و 🏁 تێدا).\nئەگەر شوفێری ڕێ ل سەر نەخشێ دیار کربیت، نەخشەیەک دهێتە ڤەکرن و ڕێیێ نیشان ددەت، و ب دوگمەیا × ل لایێ ڕاستێ سەری دادخەی.\nئەگەر دیار نەکربیت، پەیاما «ببوورە، شوفێری ڕێ ل سەر نەخشێ دیار نەکرییە» دیار دبیت."],["٤. ناردنا داخوازێ","«🙋 داخواز بشێنە» بگرە و دلنیابوونێ بکە. شوفێر ئاگەهدار دبیت.\nدەمێ شوفێری وەرگرت یان ڕەتکر، ئەز ئاگەهدار دبی. پشتی وەرگرتنێ دوگمەیا WhatsApp دیار دبیت بۆ پەیوەندیێ.\nئەگەر هەمی جه پڕ بن یان ڕێ ب دوماهی هاتبیت، نەشێی داخوازێ بشێنی."],["٥. وەک شوفێر: بەلاڤکرنا ڕێیێ","ل تابا «ڕێ زێدەبکە» ڤان تشتان پڕ بکە: جهێ دەستپێکێ و مەبەستێ (ب نڤیسین یان ب دەستدانێ ل سەر نەخشێ)، دەمێ چوونێ، ژمارا جهێن بەتاڵ، کرێیا هەر سەرنشینەکی، جۆرێ جهی، ڕۆژێن چوونێ و ماوەیێ چوونێ (پێدڤییە).\nئەگەر هەردوو جهان ل سەر نەخشێ دیار بکەی، دووری و ماوەیێ گەهشتنێ ب خۆکار دهێنە نڤیسین.\nپاشی «🚀 ڕێیێ بەلاڤ بکە» بگرە."],["٦. جهێ دەرچوونێ و مەبەستێ هەلبژێرە","ل تابا «ڕێ زێدەبکە» بۆ هەر یەک ژ «ژ کیرێ» و «بۆ کیرێ»:\n١) پارێزگەهێ هەلبژێرە\n٢) باژار یان قەزایێ هەلبژێرە (ئەڤ هەردوو پێدڤینە)\n٣) ناحیەیێ هەلبژێرە (ئارەزوومەندانە)\n٤) جهێ دیارکری بنڤیسە (گەڕەک، شەقام، نێزیک...) یان ل سەر نەخشێ دیار بکە.\nل هەر لیستەکێ خانەیا گەڕانێ 🔎 هەیە.\n📍 ناڤنیشانێ خۆ ژی (ل تابا «ڕێ») ب هەمان شێوە هەلبژێرە و بنڤیسە."],["٧. ماوەیێ بەردەستبوونا ڕێیێ","ڕێ هەتا ڕۆژا دوماهیێ یا هەلبژارتی + دەمێ دەرچوونێ + ماوەیێ چوونێ بەردەستە.\nبۆ نموونە: ئێکشەمبی هەتا چارشەمبی، دەمژمێر ٧:٣٠ AM، ماوە ٣٠ خولەک ← بەردەستە هەتا چارشەمبی ٨:٠٠ AM.\nپشتی وێ ڕێ وەک «ب دوماهی هات» دمینیت بۆ تە و دشێی ب 🗑️ ژێبەی."],["٨. کرێیا هەر سەرنشینەکی","شوفێر خۆ کرێیا هەر سەرنشینەکی دیار دکەت (بۆ نموونە ٢٠٠٠ دینار) دەمێ ڕێیێ بەلاڤ دکەت.\nسەرنشین ڤی بڕی ددەتە شوفێری. کرێ ل سەر کارتا ڕێیێ دیار دبیت و ڕێککەفتنا پارەدانێ د ناڤبەرا هەوەدایە."],["٩. وەرگرتن و ڕەتکرنا داخوازان","ل تابا «داخواز» داخوازێن سەرنشینان دبینی و «✅ وەرگرتن» یان «❌ ڕەتکرن» دکەی.\nپشتی وەرگرتنێ، ژمارا تەلەفۆنێ - WhatsApp و ناڤنیشانێ سەرنشینی دبینی."],["١٠. دەمێ چوونێ","دەمێ دەمێ دەرچوونێ دهێت، دوو دوگمە چالاک دبن (بەری وێ داخستینە):\n🚗 «دەستپێکرنا چوونێ»: شوفێر دگریت و هەمی سەرنشین ئاگەهدار دبن.\n🙋 «ئامادەمە»: سەرنشین دگریت و شوفێر ناڤ و ناڤنیشانێ وی دبینیت.\nئەگەر بەری دەمی بگری، پەیامەک دیار دبیت کو بەردەست نینە هەتا دەمێ چوونێ دهێت.\nڤان دوگمەیان تنێ د ماوەیێ چوونێدا کار دکەن."],["١١. هەلوەشاندن و ژێبرن","دشێی داخواز یان ڕێیێ هەلبوەشێنی **بەری دەمێ دەرچوونێ** یان **پشتی تەمامبوونا ماوەیێ چوونێ یا وێ ڕۆژێ** (بۆ ڕۆژێن مایی). د ماوەیێ چوونێدا نەشێی. لایێ دی ئاگەهدار دبیت.\nڕێ و داخوازێن ب دوماهی هاتی یان هەلوەشاندی ب دوگمەیا 🗑️ دهێنە ژێبرن."],["١٢. ئاگەهدارکرن","ل سەری 🔔 بگرە و «ئاگەهدارکرنا مۆبایلێ چالاک بکە»، و ل Chrome ڕێ بدە.\nبۆ ئەوێ ئاگەهدارکرن دەمێ ئەپ ڤەمریایی ژی بهێن، پێدڤییە سێرڤەر ڕێکخرابیت.\nبۆ ئەوێ وەک ئەپ بیت: Chrome ← ⋮ ← Install app."],["١٣. ئاسایش","بەری سواربوونێ ناڤ و ژمارە و ئۆتۆمبێلێ بپشکنە، ل جهەکێ گشتی ئێکدو ببینن، و ئەگەر هەستێ ب نەڕەحەتیێ کر نەچە.\nئەڤ ماڵپەڕە تنێ گرێدانە؛ هەر ڕوودان یان ئاڵۆزییەک د ناڤبەرا خۆدا چارەسەر دکەن و خودانێ ماڵپەرێ بەرپرسیار نینە."]];
(function(){var ADD={"ckb":{"loc":["شوێنی دەرچوون و مەبەست هەڵبژێرە","لە تابی «ڕێگا زیادبکە» بۆ هەر یەک لە «لە کوێوە» و «بۆ کوێ»:\n١) پارێزگا هەڵبژێرە\n٢) شار یان قەزا هەڵبژێرە (ئەم دووانە پێویستن)\n٣) ناحیە هەڵبژێرە (ئارەزوومەندانە)\n٤) شوێنی دیاریکراو بنووسە (گەڕەک، شەقام، نزیک...) یان لەسەر نەخشە دیاری بکە.\nلە هەر لیستێک خانەی گەڕان 🔎 هەیە.\n📍 ناونیشانی خۆشت (لە تابی «ڕێگاکان») بە هەمان شێوە هەڵبژێرە و بینووسە."],"map":["ڕێگاکە لەسەر نەخشە ببینە","لە تابی «ڕێگاکان» دەست لەسەر بەشی شوێنی دەرچوون و مەبەست بدە (ئەو بەشەی کە 📍 و 🏁ی تێدایە).\nئەگەر شۆفێر ڕێگاکەی لەسەر نەخشە دیاری کردبێت، نەخشەیەک دەکرێتەوە و ڕێگاکە پیشان دەدات، و بە دوگمەی × لای ڕاستی سەرەوە دایدەخەیت.\nئەگەر دیاری نەکردبێت، پەیامی «ببوورە، شۆفێرەکە ڕێگاکەی لەسەر نەخشە دیاری نەکردووە» دەردەکەوێت."]},"en":{"loc":["Choose start and destination","In the “Offer a ride” tab, for both “From” and “To”:\n1) Choose the governorate\n2) Choose the city or district (both are required)\n3) Choose the sub-district (optional)\n4) Type the exact place (area, street, near...) or pick it on the map.\nEvery list has a 🔎 search box.\n📍 Your own address (in the “Rides” tab) is chosen the same way."],"map":["See the route on the map","In the “Rides” tab tap the start/destination area of a ride (the part with 📍 and 🏁).\nIf the driver marked the route on the map, a map opens showing it; close it with the × at the top right.\nIf not, you will see a message saying the driver did not mark the route on the map."]},"ar":{"loc":["اختر نقطة الانطلاق والوجهة","في تبويب «أضف رحلة» لكل من «من أين» و«إلى أين»:\n1) اختر المحافظة\n2) اختر المدينة أو القضاء (الاثنان مطلوبان)\n3) اختر الناحية (اختياري)\n4) اكتب المكان المحدد (الحي، الشارع، قرب...) أو حدده على الخريطة.\nفي كل قائمة خانة بحث 🔎.\n📍 عنوانك (في تبويب «الرحلات») يُحدَّد بنفس الطريقة."],"map":["شاهد الطريق على الخريطة","في تبويب «الرحلات» اضغط على منطقة نقطة الانطلاق والوجهة في الرحلة (التي فيها 📍 و🏁).\nإذا حدد السائق الطريق على الخريطة تُفتح خريطة تعرضه، وتغلقها بزر × أعلى اليمين.\nوإن لم يحدد تظهر رسالة بأن السائق لم يحدد الطريق على الخريطة."]}};["ckb","en","ar"].forEach(function(l){var a=GUIDE[l];if(!a)return;a.splice(5,0,ADD[l].loc);a.splice(3,0,ADD[l].map);a.forEach(function(x,i){if(i<1)return;var n=String(i);if(l==="ckb")n=n.replace(/\d/g,function(d){return String.fromCharCode(1632+ +d)});x[0]=n+". "+x[0].replace(/^[\d\u0660-\u0669]+\.\s*/,"")})})})();

function fetchRoute(a,b,cb){
 fetch("https://router.project-osrm.org/route/v1/driving/"+a[1]+","+a[0]+";"+b[1]+","+b[0]+"?overview=simplified&geometries=geojson").then(function(r){return r.json()}).then(function(j){
  if(!j.routes||!j.routes[0]){cb(null);return}
